# HOMEBASE VPS (the Mac app, deploy/macapp --vps) reaches this server as http://homebase-vps:8850 / :8852 through its
# SSH SOCKS proxy (/etc/hosts: homebase-vps = 127.0.0.2, so only that proxy can reach it). The desk and chart services
# accept a loopback Host / Origin only (netguard) and grant CORS to http://localhost:8850 only, so this hands each
# request on as Host 127.0.0.1:<same port>, Origin http://localhost:<the page's port>. Installed by install.sh.
map $http_upgrade $hb_connection { default upgrade; "" close; }
map $http_origin $hb_origin { default ""; "~^https?://[^/:]+(?<hbport>:[0-9]+)?$" "http://localhost$hbport"; }
# the services answer CORS for the origin they were handed (localhost); the page asked as homebase-vps
map $upstream_http_access_control_allow_origin $hb_acao { default $http_origin; "" ""; }
server {
    listen 127.0.0.2:8850;
    listen 127.0.0.2:8852;
    server_name homebase-vps;
    location / {
        proxy_pass http://127.0.0.1:$server_port;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:$server_port;
        proxy_set_header Origin $hb_origin;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $hb_connection;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        client_max_body_size 50m;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin $hb_acao always;
    }
}
