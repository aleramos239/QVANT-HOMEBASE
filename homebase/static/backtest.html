<!-- 2026-09-28 three-tabs plan: the same chart shell as charts.html, minus every trading module
     (deskclient/paperclient/tradeui/tradelines/orderpanel/dom/domui/trade.js, and the Level 2/News
     overlays not named in the design's scope) -- see docs/superpowers/specs/2026-09-28-three-tabs-design.md.
     window.HB_PAGE tells the shared app.js/panel.js which storage namespace (layouts, the bottom
     panel's default) and /ws page kind to use. -->
<script>window.HB_PAGE = 'backtest';</script>

<body class="lab-page">
<header class="hb-bar lab-bar">
  <div class="hb-bar-l">
    <span class="hb-mark"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 9.5V21h14V9.5"/></svg></span><b class="hb-word">Homebase</b>
    <nav class="pgsw" id="pgSw" aria-label="Pages"><a href="#" data-page="desk">Desk</a><a href="#" data-page="charts">Charts</a><a href="#" data-page="backtest" aria-current="page">Lab</a></nav>
    <div class="tabstrip" id="tabStrip" role="tablist" aria-label="Layout tabs"></div>
  </div>
  <div class="lab-doc" id="labDoc"></div>
  <div class="hb-bar-r">
    <div class="lab-acts" id="labActs"></div>
    <div class="lab-togs hb-lens" id="labPanels" role="group" aria-label="Show or hide panels">
      <button type="button" class="hb-ib" data-panel="lib" aria-pressed="true" aria-label="Strategies" title="Strategies"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15" rx="3.5"/><path d="M9 4.5v15"/></svg></button>
      <button type="button" class="hb-ib" data-panel="code" aria-pressed="true" aria-label="Code" title="Code"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 7.5L4 12l4.5 4.5M15.5 7.5L20 12l-4.5 4.5"/></svg></button>
      <button type="button" class="hb-ib" data-panel="chart" aria-pressed="false" aria-label="Chart" title="Chart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3.5v3M7 15.5v5M17 3.5v6M17 16.5v4"/><rect x="5" y="6.5" width="4" height="9" rx="1.2"/><rect x="15" y="9.5" width="4" height="7" rx="1.2"/></svg></button>
      <button type="button" class="hb-ib" data-panel="res" aria-pressed="true" aria-label="Results" title="Results"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15" rx="3.5"/><path d="M15 4.5v15"/></svg></button>
    </div>
    <button class="tb-btn tb-icon" id="tbSettings" type="button" title="Chart settings" aria-label="Chart settings" aria-haspopup="dialog"><span class="icw" data-icon="gear"></span></button>
    <button class="hb-ib hb-lens lab-round" id="tbTheme" type="button" title="Dark theme" aria-label="Switch theme"><span class="icw" data-icon="moon"></span></button>
  </div>
</header>
<div id="lab" class="lab" aria-label="Strategy Lab">
  <aside class="lab-side lab-lib" id="labLib" aria-label="Strategies"><div class="in"></div></aside>
  <!-- the strategy pipeline's page (Queue / Book / Guide): it has the middle while one of those views is open; the editor, the chart
       and the result are hidden meanwhile, never rebuilt (lab.js applyPanels) -->
  <section class="lab-pipe" id="labPipe" aria-label="Strategy pipeline"><div class="in"></div></section>
  <section id="labEd" aria-label="Editor"></section>
  <div class="lab-split" id="labSplit" role="separator" aria-orientation="vertical" aria-label="Resize the editor and the chart" tabindex="0"></div>
  <div class="lab-chart" id="labChart" aria-label="Chart">
<header class="toolbar" role="toolbar" aria-label="Chart toolbar">
  <div class="lab-nav hb-lens" id="labNav" role="group" aria-label="Step through the trades">
    <button type="button" class="lab-nav-b" data-nav="-1" aria-label="Previous trade" title="Previous trade">‹</button>
    <span class="lab-nav-t" id="labNavText" aria-live="polite"></span>
    <button type="button" class="lab-nav-b" data-nav="1" aria-label="Next trade" title="Next trade">›</button>
  </div>
  <button class="tb-pill" id="tbSymbol" type="button" aria-haspopup="menu" aria-expanded="false"><span class="icw" data-icon="search"></span><span id="tbSymbolText">NQ</span></button>
  <span class="tb-sep"></span>
  <div class="tb-group hb-lens" id="tbFavs" role="group" aria-label="Interval"></div>
  <button class="tb-btn tb-icon" id="tbIntervals" type="button" title="More intervals" aria-haspopup="menu" aria-expanded="false"><span class="icw sm" data-icon="chevron"></span></button>
  <span class="tb-sep"></span>
  <button class="tb-btn" id="tbIndicators" type="button" title="Indicators"><span class="icw" data-icon="indicators"></span><span class="tb-label">Indicators</span></button>
  <span class="tb-sep"></span>
  <button class="tb-btn" id="tbReplay" type="button" title="Bar Replay" aria-haspopup="menu" aria-expanded="false"><span class="icw" data-icon="history"></span><span class="tb-label">Replay</span></button>
  <span class="tb-sep"></span>
  <button class="tb-btn" id="tbGrid" type="button" title="Chart layout" aria-haspopup="menu" aria-expanded="false"><span class="thumb" id="tbGridThumb"></span><span class="icw sm" data-icon="chevron"></span></button>
  <span class="tb-spacer"></span>
</header>
<div class="main">
  <nav class="rail" id="rail" aria-label="Drawing tools">
    <button class="rail-btn" type="button" data-tool="cursor" title="Cursor" aria-pressed="true"><span class="icw" data-icon="cursor"></span></button>
    <button class="rail-btn" type="button" data-tool="trend" title="Trend line" aria-pressed="false"><span class="icw" data-icon="trend"></span></button>
    <button class="rail-btn" type="button" data-tool="ray" title="Ray" aria-pressed="false"><span class="icw" data-icon="ray"></span></button>
    <button class="rail-btn" type="button" data-tool="xline" title="Extended line" aria-pressed="false"><span class="icw" data-icon="xline"></span></button>
    <button class="rail-btn" type="button" data-tool="hline" title="Horizontal line" aria-pressed="false"><span class="icw" data-icon="hline"></span></button>
    <button class="rail-btn" type="button" data-tool="vline" title="Vertical line" aria-pressed="false"><span class="icw" data-icon="vline"></span></button>
    <button class="rail-btn" type="button" data-tool="rect" title="Rectangle" aria-pressed="false"><span class="icw" data-icon="rect"></span></button>
    <button class="rail-btn" type="button" data-tool="fib" title="Fib retracement" aria-pressed="false"><span class="icw" data-icon="fib"></span></button>
    <button class="rail-btn" type="button" data-tool="long" title="Long position" aria-pressed="false"><span class="icw" data-icon="long"></span></button>
    <button class="rail-btn" type="button" data-tool="short" title="Short position" aria-pressed="false"><span class="icw" data-icon="short"></span></button>
    <button class="rail-btn" type="button" data-tool="measure" title="Measure" aria-pressed="false"><span class="icw" data-icon="measure"></span></button>
    <span class="rail-sep"></span>
    <div class="rail-split">
      <button class="rail-btn" type="button" id="railMagnet" title="Magnet off" aria-label="Magnet off" aria-pressed="false"><span class="icw" data-icon="magnet"></span></button>
      <button class="rail-corner" type="button" id="railMagnetMore" title="Magnet mode" aria-label="Magnet mode" aria-haspopup="menu" aria-expanded="false"></button>
    </div>
    <button class="rail-btn" type="button" id="railClear" title="Remove drawings"><span class="icw" data-icon="trash"></span></button>
  </nav>
  <div class="grid" id="grid"></div>
  <aside class="pdock" id="pdock" aria-label="Docked panels" hidden></aside>
</div>
<section class="bpanel" id="bpanel" aria-label="Strategy Tester and Bar Replay">
  <div class="bp-resize" id="bpResize" role="separator" aria-orientation="horizontal" aria-label="Resize the panel" tabindex="0"></div>
  <div class="bp-bar"><div class="bp-tabs" id="bpTabs" role="tablist"></div><span class="bp-spacer"></span>
    <button class="bp-toggle" id="bpToggle" type="button" aria-label="Open the panel" title="Open the panel"><span class="icw" data-icon="chevronUp"></span></button></div>
  <div class="bp-body" id="bpBody"></div>
</section>
  </div>
  <aside class="lab-side" id="labRes" aria-label="Backtest result"><div class="in"></div></aside>
  <input type="file" id="labFile" accept=".py,text/x-python,text/plain" hidden>
</div>
<div id="floatLayer" aria-label="Floating panels"></div>
<div class="toasts" id="toastRoot" aria-live="polite"></div>
<footer class="statusbar" id="statusbar">
  <!-- W1: data-drop ranks the segments that step out WHOLE when the bar is too narrow (the lowest first, app.js
       fitStatusBar); the connection and desk state never do -->
  <span class="sb-dot" id="sbDot"></span><span class="sb-mode" id="sbMode">Connecting…</span><span class="sb-feed" id="sbFeed"></span>
  <span class="sb-desk" id="sbDesk"><span class="sb-dot" id="sbDeskDot"></span><span class="sb-desk-state" id="sbDeskText"></span><span class="sb-desk-why" id="sbDeskWhy" data-drop="6"></span><span class="sb-desk-lim" id="sbDeskLim" data-drop="3"></span><a class="sb-desk-link" id="sbDeskLink" href="#" target="_blank" rel="noopener" hidden>Open the desk</a></span>
  <span class="sb-spacer" id="sbSpacer"></span>
  <span class="sb-note" id="sbNote" role="status"></span>
  <span class="sb-event" id="sbEvent" hidden data-drop="4"></span>
  <span class="sb-clock" id="sbClock" data-drop="5" title="Eastern Time"></span><span class="sb-opt" id="sbBudget" data-drop="2"></span><span class="sb-opt" id="sbRec" data-drop="1"></span>
  <a class="sb-credit" id="sbCredit" href="https://www.tradingview.com/" target="_blank" rel="noopener noreferrer" title="Charts: TradingView Lightweight Charts™ · Copyright (c) 2025 TradingView, Inc. · https://www.tradingview.com/" aria-label="Charts: TradingView Lightweight Charts™ (attribution)"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg></a>
</footer>
